<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Caso de estudio de una plataforma modular de gestión de innovación." />
    <title>Plataforma modular de gestión de innovación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root { --theme-color: #b91c1c; }
      body { color: #1e293b; }
      .sidebar { border-right: 1px solid #e2e8f0; }
      .sidebar-nav > ul > li > a { font-weight: 700; }
      .markdown-section { max-width: 1040px; }
      .markdown-section img { border-radius: 10px; }
      .app-name-link { color: #0f172a !important; font-weight: 700; }
      @media (min-width: 769px) {
        .markdown-section { padding: 36px 48px 80px; }
      }
    </style>
  </head>
  <body>
    <div id="app">Cargando caso de estudio…</div>
    <script>
      window.$docsify = {
        name: "Plataforma de innovación",
        homepage: "README.md",
        loadSidebar: true,
        auto2top: true,
        subMaxLevel: 0,
        relativePath: true,
        search: {
          placeholder: "Buscar",
          noData: "Sin resultados"
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
