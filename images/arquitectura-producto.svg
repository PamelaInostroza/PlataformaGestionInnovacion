<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura modular del producto</title>
  <desc id="desc">Usuarios y administradores interactúan con el sistema de ingreso y el portal, conectados mediante una base PostgreSQL que alimenta indicadores, reportes, APIs e integraciones.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 14px Arial, sans-serif; fill: #64748b; }
      .label { font: 600 14px Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <text x="600" y="48" text-anchor="middle" class="title">Arquitectura modular del producto</text>

  <g filter="url(#shadow)">
    <rect x="55" y="105" width="220" height="110" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="145" text-anchor="middle" class="box-title">Administradores</text>
    <text x="165" y="174" text-anchor="middle" class="box-copy">Configuración y gestión</text>

    <rect x="55" y="385" width="220" height="130" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="425" text-anchor="middle" class="box-title">Usuarios del portal</text>
    <text x="165" y="454" text-anchor="middle" class="box-copy">Equipos internos</text>
    <text x="165" y="478" text-anchor="middle" class="box-copy">Investigadores y público</text>

    <rect x="365" y="90" width="300" height="145" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="515" y="137" text-anchor="middle" class="box-title">Ingreso y administración</text>
    <text x="515" y="169" text-anchor="middle" class="box-copy">Django · formularios · validaciones</text>
    <text x="515" y="195" text-anchor="middle" class="box-copy">permisos · importación masiva</text>

    <rect x="365" y="370" width="300" height="160" rx="20" fill="#f0fdf4" stroke="#86efac"/>
    <text x="515" y="415" text-anchor="middle" class="box-title">Portal y analítica</text>
    <text x="515" y="447" text-anchor="middle" class="box-copy">Next.js · catálogos · fichas</text>
    <text x="515" y="473" text-anchor="middle" class="box-copy">dashboards · herramientas · PDF</text>

    <rect x="755" y="225" width="260" height="150" rx="22" fill="#fff7ed" stroke="#fdba74"/>
    <ellipse cx="885" cy="260" rx="72" ry="18" fill="#ffedd5" stroke="#fb923c"/>
    <path d="M813 260v63c0 10 32 18 72 18s72-8 72-18v-63" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="885" y="295" text-anchor="middle" class="box-title">PostgreSQL</text>
    <text x="885" y="323" text-anchor="middle" class="box-copy">Datos y relaciones</text>

    <rect x="1050" y="100" width="105" height="105" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="1102" y="142" text-anchor="middle" class="box-title">API</text>
    <text x="1102" y="169" text-anchor="middle" class="box-copy">Integración</text>

    <rect x="1030" y="405" width="145" height="120" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="1102" y="447" text-anchor="middle" class="box-title">Indicadores</text>
    <text x="1102" y="477" text-anchor="middle" class="box-copy">Reportes y metas</text>
  </g>

  <path class="line" d="M275 160 H365"/>
  <path class="line" d="M275 450 H365"/>
  <path class="line" d="M665 163 C725 163 720 268 755 278"/>
  <path class="line" d="M755 330 C720 345 720 450 665 450"/>
  <path class="line" d="M1015 270 C1050 250 1060 205 1075 195"/>
  <path class="line" d="M1015 335 C1050 355 1068 392 1080 405"/>

  <text x="600" y="585" text-anchor="middle" class="label">Componentes desacoplados y configurables según procesos, permisos e identidad de cada organización</text>
</svg>
