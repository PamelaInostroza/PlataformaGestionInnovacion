<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Flujo funcional de la plataforma</title>
  <desc id="desc">La información se ingresa, se valida y organiza, se consulta en el portafolio y finalmente se analiza y reporta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="270" rx="28" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Del ingreso de datos a la toma de decisiones</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(45 82)">
      <rect width="240" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="120" cy="38" r="21" fill="#dbeafe"/>
      <text x="120" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">1</text>
      <text x="120" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ingresar información</text>
      <text x="120" y="107" text-anchor="middle" font-size="14" fill="#64748b">Formularios y carga masiva</text>
    </g>
    <g transform="translate(335 82)">
      <rect width="240" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="120" cy="38" r="21" fill="#dcfce7"/>
      <text x="120" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">2</text>
      <text x="120" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Validar y organizar</text>
      <text x="120" y="107" text-anchor="middle" font-size="14" fill="#64748b">Reglas, relaciones y permisos</text>
    </g>
    <g transform="translate(625 82)">
      <rect width="240" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="120" cy="38" r="21" fill="#fef3c7"/>
      <text x="120" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#d97706">3</text>
      <text x="120" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Consultar el portafolio</text>
      <text x="120" y="107" text-anchor="middle" font-size="14" fill="#64748b">Fichas y entidades relacionadas</text>
    </g>
    <g transform="translate(915 82)">
      <rect width="240" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="120" cy="38" r="21" fill="#fee2e2"/>
      <text x="120" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">4</text>
      <text x="120" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Analizar y reportar</text>
      <text x="120" y="107" text-anchor="middle" font-size="14" fill="#64748b">Indicadores y decisiones</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M292 147 H325"/>
    <path d="M582 147 H615"/>
    <path d="M872 147 H905"/>
  </g>
</svg>
